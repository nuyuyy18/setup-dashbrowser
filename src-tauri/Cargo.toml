[package]
name = "dashbrowser-desktop"
version = "2.0.0"
description = "DashBrowser Ultra-Lightweight Desktop Client"
authors = ["rausal43"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
